services:
  - type: web
    name: nexxora
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nexxora.onrender.com"
      - key: DATABASE_URL
        sync: false