{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · Nexxora</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><main class="app-shell"><a class="brand" href="{% url 'home' %}">Nexxora</a><div class="card" style="margin-top:20px"><h1>🔔 Notifications {% if unread_count %}<small class="eyebrow">{{ unread_count }} unread</small>{% endif %}</h1><button class="ghost" onclick="fetch('{% url 'mark_notifications_read' %}',{method:'POST',headers:{'X-CSRFToken':(document.cookie.match(/csrftoken=([^;]+)/)||[])[1]||''}}).then(()=>location.reload())">Mark all as read</button>{% for n in notifications %}<div class="comment-item"><b>@{{ n.actor.username }}</b> {{ n.text }}<small class="muted" style="display:block">{{ n.created_at|timesince }} ago</small></div>{% empty %}<p class="muted">No notifications.</p>{% endfor %}</div></main></body></html>
