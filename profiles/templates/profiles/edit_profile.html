{% load static %}
<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Edit Profile · Nexxora</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link rel="stylesheet" href="{% static 'css/auth.css' %}">
        <link rel="stylesheet" href="{% static 'css/social-pages.css' %}">
    </head>

    <body>
        <main class="auth-page edit-profile-page">
            <div class="auth-card card edit-profile-card"><a class="brand center" href="{% url 'home' %}">Nexxora</a>
                <span class="eyebrow">YOUR PROFILE</span><h1>Edit profile</h1>
                <p class="muted center">Keep your profile current and recognisable.</p>{% if profile.avatar %}<div class="edit-avatar-wrap"><img class="big-avatar" src="{{ profile.avatar.url }}" alt="Current profile picture"></div>{% endif %}<form method="post" class="edit-profile-form"
                    enctype="multipart/form-data">{% csrf_token %}<div class="profile-form-section"><h3>Account details</h3>{{ user_form.as_p }}</div><div class="profile-form-section"><h3>Profile details</h3>{{ profile_form.as_p }}</div><button
                    class="primary full">Save changes</button></form><a class="back" href="{% url 'profile' user.username %}">← Back to profile</a>
            </div>
        </main>
    </body>

</html>
