{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify · Nexxora</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><main class="app-shell" style="max-width:520px;padding-top:8vh"><section class="card glass"><span class="eyebrow">SECURITY CHECK</span><h1>Verify your login</h1><p class="muted">Enter the 6-digit verification code sent to your account email.</p>{% for message in messages %}<div class="card" style="padding:10px;margin:10px 0">{{ message }}</div>{% endfor %}{% if dev_code %}<div class="card" style="border-color:rgba(108,92,231,.5);margin:15px 0"><b>Local development code:</b><div style="font-size:30px;letter-spacing:8px;margin-top:5px">{{ dev_code }}</div></div>{% endif %}<form method="post">{% csrf_token %}<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456" required style="width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);margin:10px 0"><button class="primary full">Verify & sign in</button></form></section></main></body></html>
